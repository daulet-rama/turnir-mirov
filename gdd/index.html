<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Документ игры «Турнир миров»</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&family=Unbounded:wght@600;700&display=swap">
<style>
/* Layout: та же тетрадь в клетку, что на стенде; одна колонка текста до 820px */
:root{
  --paper:#F4F7FB; --grid:rgba(52,96,178,.11); --surface:#FFFFFF; --ink:#172033; --muted:#566176; --rule:#D5DDEA; --accent:#2C5BE0;
  --font-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --font-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --font-mono:"JetBrains Mono",ui-monospace,Consolas,monospace;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --paper:#18221F; --grid:rgba(214,232,222,.055); --surface:#1F2B27; --ink:#E6EDE8; --muted:#9DB0A6; --rule:#30403A; --accent:#86A6FF; color-scheme:dark; } }
:root[data-theme="dark"]{ --paper:#18221F; --grid:rgba(214,232,222,.055); --surface:#1F2B27; --ink:#E6EDE8; --muted:#9DB0A6; --rule:#30403A; --accent:#86A6FF; color-scheme:dark; }
*{box-sizing:border-box}
body{margin:0; background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px; color:var(--ink); font-family:var(--font-body); font-size:16px; line-height:1.6}
a{color:var(--accent); text-underline-offset:3px}
a:focus-visible{outline:3px solid var(--accent); outline-offset:2px; border-radius:4px}
.top{position:sticky; top:env(safe-area-inset-top,0px); z-index:5; background:var(--paper); border-bottom:1px solid var(--rule)}
.top .in,.wrap{max-width:820px; margin:0 auto; padding-left:max(16px, env(safe-area-inset-left,0px)); padding-right:max(16px, env(safe-area-inset-right,0px))}
.top .in{display:flex; gap:16px; align-items:baseline; justify-content:space-between; padding-block:10px; flex-wrap:wrap}
.top a{font-weight:600; text-decoration:none}
.top span{color:var(--muted); font-size:.85rem}
.wrap{padding-block:32px 72px}
.md h1,.md h2{font-family:var(--font-display); line-height:1.2; text-wrap:balance}
.md h1{font-size:clamp(1.7rem,5vw,2.4rem); margin:.2em 0 .6em}
.md h2{font-size:1.4rem; margin:2.2em 0 .6em}
.md h3{font-size:1.12rem; margin:1.8em 0 .5em; text-wrap:balance}
.md p,.md li{max-width:72ch}
.md ul,.md ol{padding-left:1.4rem}
.md table{display:block; max-width:100%; overflow-x:auto; border-collapse:collapse; font-size:.92rem; margin:1.2em 0; background:var(--surface)}
.md th,.md td{border:1px solid var(--rule); padding:8px 11px; text-align:left; vertical-align:top; min-width:7rem}
.md th{background:var(--paper)}
.md code{font-family:var(--font-mono); font-size:.86em; background:var(--surface); border:1px solid var(--rule); padding:1px 5px; border-radius:5px}
.md pre{overflow-x:auto; background:var(--surface); border:1px solid var(--rule); border-radius:10px; padding:12px}
.md pre code{border:0; padding:0}
.md blockquote{margin:1em 0; padding-left:14px; border-left:3px solid var(--rule); color:var(--muted)}
.md hr{border:0; border-top:1px solid var(--rule); margin:2em 0}
.md img{max-width:100%}
.md .markdown-heading{position:relative}
.md .anchor{position:absolute; left:-22px; top:.15em; opacity:0; color:var(--muted)}
.md .markdown-heading:hover .anchor,.md .anchor:focus{opacity:.7}
.md .octicon{fill:currentColor; width:16px; height:16px}
.src{margin-top:3em; padding-top:1em; border-top:1px solid var(--rule); color:var(--muted); font-size:.9rem}
</style>
</head>
<body>
<header class="top"><div class="in"><a href="../">← Стенд «Турнира миров»</a><span>дописывается</span></div></header>
<main class="wrap">
<article class="md">
<h1>Документ игры «Турнир миров»</h1><p>Документ ещё дописывается и появится здесь после следующего обновления сайта.</p><p>Пока его можно читать в Claude: <a href="https://claude.ai/artifact/GVKdJciqrtTQyG9RaNvv4p">Документ игры «Турнир миров»</a> (нужен вход).</p>
</article>
<p class="src"></p>
</main>
</body>
</html>
